name: yugioh price fetcher

on:
  schedule:
    - cron: "0 16 * * *"
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest

    steps:

      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: install python packages
        run: |
          pip install requests

      - name: test script
        run: |
          python -c "print('GitHub automation working')"
