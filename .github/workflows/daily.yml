name: yugioh price fetcher

on:
  schedule:
    - cron: "0 16 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest

    steps:

      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y p7zip-full

      - name: install python packages
        run: |
          pip install -r requirements.txt
    
      - name: run yugioh fetcher
        run: |
          python -m scripts.fetch_prices
      
      - name: Calculate top gainers
        run: |
          python -m scripts.top_gainers
        continue-on-error: true

      - name: Calculate early movers
        run: |
          python -m scripts.early_movers
        continue-on-error: true

      - name: Commit results to repo
        if: success()
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add data/prices.db data/top_gainers.json data/early_movers_all_years.json data/early_movers_2007_onward.json data/signals.db
          git diff --cached --quiet || (git commit -m "Update prices.db (incl. subtype provenance), top_gainers.json, early_movers caches, and signals.db" && git push)
