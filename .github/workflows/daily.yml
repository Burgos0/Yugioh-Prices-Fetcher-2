name: yugioh price fetcher

on:
  schedule:
    # 14:00 UTC (7am Pacific). GitHub often starts scheduled runs hours late;
    # running early in the UTC day keeps delays from crossing midnight,
    # which used to skip a date in the price history.
    - cron: "0 14 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write      # publish the static site to GitHub Pages
  id-token: write   # required by actions/deploy-pages

# Serialize runs so two overlapping schedule/dispatch triggers can never
# race to restore/persist the DB snapshot at the same time. Queue rather
# than cancel, so a run is never dropped.
concurrency:
  group: yugioh-price-fetcher-daily
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}

    steps:

      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y p7zip-full

      - name: install python packages
        run: |
          pip install -r requirements.txt

      - name: restore latest database snapshot
        id: restore_snapshot
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python -m scripts.restore_snapshot

      - name: run yugioh fetcher
        id: fetch
        run: |
          python -m scripts.fetch_prices
      
      - name: Calculate top gainers
        id: top_gainers
        run: |
          python -m scripts.top_gainers
        continue-on-error: true

      - name: Calculate early movers
        id: early_movers
        run: |
          python -m scripts.early_movers
        continue-on-error: true

      - name: publish database snapshot
        id: publish_snapshot
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python -m scripts.publish_snapshot --source-commit "${{ github.sha }}"

      - name: Commit results to repo
        if: success() && steps.top_gainers.outcome == 'success' && steps.early_movers.outcome == 'success'
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add data/top_gainers.json data/sealed_gainers.json data/early_movers_all_years.json data/early_movers_2007_onward.json
          git diff --cached --quiet || (git commit -m "Update top_gainers.json and early_movers caches" && git push)

      # Publish the public site (tcgtrending.com) only when fresh gainers exist,
      # so a failed analysis never overwrites the live site with stale data.
      - name: Build static site
        if: success() && steps.top_gainers.outcome == 'success'
        env:
          GOATCOUNTER_CODE: ${{ vars.GOATCOUNTER_CODE }}
          AFFILIATE_BASE_URL: ${{ vars.AFFILIATE_BASE_URL }}
          IMPACT_VERIFICATION_TAG: ${{ vars.IMPACT_VERIFICATION_TAG }}
        run: |
          python -m scripts.build_static --out site --domain tcgtrending.com

      - name: Upload site artifact
        if: success() && steps.top_gainers.outcome == 'success'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deploy
        if: success() && steps.top_gainers.outcome == 'success'
        uses: actions/deploy-pages@v4

      # Fetch succeeding is enough to publish a database snapshot (data is
      # valuable even if analysis fails), but an analysis failure must still
      # mark the WORKFLOW itself failed -- continue-on-error above only
      # keeps the job running long enough to publish the snapshot and skip
      # the commit step; a warning alone is not sufficient signal.
      - name: fail workflow if analysis steps did not succeed
        if: always() && steps.fetch.outcome == 'success' && (steps.top_gainers.outcome != 'success' || steps.early_movers.outcome != 'success')
        run: |
          echo "::error::Analysis failed (top_gainers=${{ steps.top_gainers.outcome }}, early_movers=${{ steps.early_movers.outcome }}). The fetched database snapshot was still published, but stale/partial display caches were NOT committed. Marking this workflow run as failed."
          exit 1
