name: ygoprodeck coverage check

on:
  workflow_dispatch:
    inputs:
      repeatability_runs:
        description: "Number of catalogue fetches to perform (>=1). Use >=3 for a repeatability sweep."
        required: false
        default: "1"

permissions:
  contents: read

jobs:
  coverage-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: install python packages
        run: |
          pip install -r requirements.txt

      - name: run ygoprodeck tcg coverage experiment
        run: |
          python -m scripts.check_ygoprodeck_tcg_coverage \
            --lookback-days 90 \
            --sample-size 20 \
            --min-interval-seconds 1.0 \
            --repeatability-runs "${{ inputs.repeatability_runs || '1' }}" \
            --cache-dir "${{ runner.temp }}/ygoprodeck_detail_cache" \
            --output "${{ runner.temp }}/ygoprodeck_tcg_coverage_report.json"

      - name: upload sanitized coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ygoprodeck-tcg-coverage-report
          path: ${{ runner.temp }}/ygoprodeck_tcg_coverage_report.json
          if-no-files-found: error
