<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Yu-Gi-Oh Price Tracker{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <header>
        <h1>Yu-Gi-Oh Card Price Tracker</h1>
        <p class="subtitle">Top Weekly Gainers</p>

        <nav class="main-nav">
            <a href="{{ url_for('main.index') }}"
               class="nav-btn {% if request.path == url_for('main.index') %}active{% endif %}">
                📈 Top Gainers
            </a>
            <a href="{{ url_for('main.penny_movers') }}"
               class="nav-btn {% if request.path == url_for('main.penny_movers') %}active{% endif %}">
                💰 Penny Movers
            </a>
            <a href="{{ url_for('main.losers') }}"
               class="nav-btn {% if request.path == url_for('main.losers') %}active{% endif %}">
                📉 Top Losers
            </a>
        </nav>
    </header>
    
    <main class="container">
        {% block content %}{% endblock %}
    </main>
    
    <footer>
        <p>Data updated daily. Prices from TCGPlayer market data.</p>
    </footer>
</body>
</html>
