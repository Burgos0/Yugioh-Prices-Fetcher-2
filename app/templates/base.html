<!DOCTYPE html>
<html lang="en">
<head>

    <title>{% block title %}Yu-Gi-Oh Price Tracker{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
